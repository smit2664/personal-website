</head>

<body class="contact-page">
<header>
  <a class="brand" href="../index.html">Calvin Smith</a>

<nav>
  <div class="has-menu">
    <a href="../index.html#locations">Locations</a>
    <ul class="menu">
      <li><a href="../locations/michigan.html">Michigan</a></li>

    </ul>
  </div>
  <a href="projects.html">Projects</a>
  <a href="contact.html" aria-current="page">Contact</a>
</nav>

<div class="header-right">
  <span class="status">

  <span class="mode-icon" aria-hidden="true">
    <svg class="icon-light" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
      <path d="M9 18h6"/><path d="M10 22h4"/>
    </svg>
    <svg class="icon-dark" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </span>

  <button id="theme" type="button" aria-pressed="true">Light mode</button>
</div>
</header>

<main class="contact">
  <h1>Let's talk!</h1>
  <p class="intro">Prints and more — reach out below!</p>

  <!-- Replace YOUR_FORM_ID with the ID from your Formspree form URL -->
  <form action="https://formspree.io/f/xpqvvdlp" method="post">
    <input type="hidden" name="_subject" value="New message from your portfolio site">
    <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="trap" aria-hidden="true">
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
    </div>
    <button class="send" type="submit">Send message</button>
  </form>
</main>
<footer>
  <span>© 2026 Calvin Smith</span>
  <span>All images shot on location :D</span>
</footer>

<script src="../theme.js"></script>

</body>
</html>
